<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>埔里歡樂二日遊｜阿宏旅遊 × Vera Yu Travel</title>

  <meta name="description"
        content="2027年1月3日至1月4日，埔里歡樂二日遊！阿宏旅遊 × Vera Yu Travel 品牌合作活動。">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff7eb;
      color: #333;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    header {
      background: linear-gradient(120deg, #f58220, #f6b73c);
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 32px;
      margin: 0 0 12px;
    }

    header p {
      font-size: 18px;
      margin: 8px 0;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .dm {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.12);
    }

    .buttons {
      max-width: 760px;
      margin: 30px auto;
    }

    .button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: white;
      font-size: 23px;
      font-weight: bold;
      padding: 22px 15px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .register {
      background: linear-gradient(120deg, #f47700, #ff9d00);
    }

    .brand {
      background: linear-gradient(120deg, #16834b, #28a76a);
    }

    .notice {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      line-height: 1.8;
      margin: 25px auto;
      max-width: 760px;
      font-size: 16px;
    }

    footer {
      background: #fff0d8;
      padding: 22px 15px;
      text-align: center;
      font-size: 16px;
      color: #634629;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      header p {
        font-size: 16px;
      }

      .button {
        font-size: 21px;
        padding: 20px 12px;
      }

      .container {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>埔里歡樂二日遊！</h1>
    <p>2027年1月3日（日）～1月4日（一）</p>
    <p>阿宏旅遊 × VERA YU TRAVEL</p>

  <main class="container">

    <img
      src="埔里歡樂二日遊旅遊海報.png""
      alt="埔里歡樂二日遊完整彩色行程DM"

    <!-- 真正可以點擊的按鈕 -->
    <div class="buttons">

      <a

        target="_blank"
        rel="noopener noreferrer"

        📝 立即線上報名
      </a>

      <a
        class="button brand"
        href="https://yuospwendy-max.github.io/vera-yu-travel/"
        target="_blank"
        rel="noopener noreferrer"
      >
        🌿 認識 Vera Yu Travel
      </a>

    </div>

    <div class="notice">
      <strong>📌 報名須知</strong>
      <p>
        本表單為報名登記，送出成功不代表已完成訂位。<br>
        房間安排、名額及最終團費，均須由旅行社確認。
      </p>

      <p>
        <strong>報名請洽：</strong><br>
        玉山通運公司・阿宏旅遊<br>
        阿宏：0982-336-986<br>
        曉麗：0988-580-518
      </p>
    </div>

  </main>

  <footer>
    玉山通運公司・阿宏旅遊<br>
    Vera Yu Travel 品牌合作作品
  </footer>

</body>
</html>
